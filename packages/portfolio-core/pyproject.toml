[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchain-portfolio-core"
version = "0.8.0"
description = "Read-only wallet observations and deterministic Decimal valuation"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["blockchain_portfolio*"]

[tool.setuptools]
include-package-data = false
